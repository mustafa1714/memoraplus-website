<!doctype html><html lang="ar" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cover — Memora Plus</title><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../dist/tokens.css"><link rel="stylesheet" href="../project/components/bundle.css"><script src="../project/components/bundle.js"></script></head><body style="margin:0;background:#fff"><div style="max-width:960px"><!-- @dsCard height=288 -->
<div class="cover" style="position:relative;width:960px;height:288px;background:var(--surface-white);overflow:hidden">
  <style>
    .cv-maroon{fill:var(--brand-maroon)} .cv-navy{fill:var(--brand-navy)} .cv-gold{fill:var(--brand-gold)} .cv-cream{fill:var(--brand-cream)} .cv-bar{fill:var(--brand-cream)}
    .cv-r{rx:var(--radius-sm)}
    .cv-name{position:absolute;inset-inline-start:48px;left:48px;bottom:56px;margin:0;font-family:var(--font-latin);font-weight:700;font-size:84px;line-height:.95;color:var(--ink);max-width:420px}
    .cv-tag{position:absolute;left:48px;bottom:24px;margin:0;font-family:var(--font-arabic);font-size:14px;line-height:22px;color:var(--ink-muted);max-width:420px;direction:rtl;text-align:left}
  </style>
  <svg width="960" height="288" viewBox="0 0 960 288" style="position:absolute;inset:0" aria-hidden="true">
    <!-- blocks: brand-maroon 240×288 slab (identity lead), brand-navy 240×176, brand-gold 240×16 band, brand-cream 240×96 -->
    <!-- arrangement: one tall maroon slab bleeding top and bottom at x=480, satellites stacked to its right edge -->
    <!-- pattern: "a literal motif" row — five vertical bars cut from the slab, echoing the M/P monogram strokes of the logo -->
    <!-- scales: bar width space-6 (24px), gaps space-4 (16px), heights multiples of space-8 (32px), corners radius-sm -->
    <rect class="cv-maroon" x="480" y="0" width="240" height="288"/>
    <rect class="cv-navy" x="720" y="0" width="240" height="176"/>
    <rect class="cv-gold" x="720" y="176" width="240" height="16"/>
    <rect class="cv-cream" x="720" y="192" width="240" height="96"/>
    <rect class="cv-bar cv-r" x="520" y="96" width="24" height="192"/>
    <rect class="cv-bar cv-r" x="560" y="64" width="24" height="224"/>
    <rect class="cv-bar cv-r" x="600" y="32" width="24" height="160"/>
    <rect class="cv-bar cv-r" x="640" y="128" width="24" height="160"/>
    <rect class="cv-gold cv-r" x="760" y="48" width="24" height="96"/>
  </svg>
  <h1 class="cv-name">Memora<br>Plus</h1>
  <p class="cv-tag">الخيار الأول للراغبين في التملك والاستثمار العقاري في تركيا</p>
</div>
<script>/* static cover */</script>
</div></body></html>
