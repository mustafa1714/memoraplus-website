# Builds the static site and publishes website/out to the `deploy` branch.
# Hostinger (hPanel > Advanced > GIT) pulls the `deploy` branch into public_html.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: npm run build

      - name: Check build output
        run: |
          test -f website/out/index.html
          test -f website/out/404.html
          test -f website/out/.htaccess
          test -f website/out/ar/index.html

      # Keeps the branch history linear (no force push), so Hostinger's `git pull` always fast-forwards.
      - name: Publish to deploy branch
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if ! git clone --depth 1 --branch deploy "$REPO_URL" publish; then
            mkdir publish
            git -C publish init -b deploy
            git -C publish remote add origin "$REPO_URL"
          fi
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a website/out/. publish/
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin deploy
